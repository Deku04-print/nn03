services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nexus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus-local-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [nexus-network]

  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [nexus-network]

  ollama-model:
    image: ollama/ollama:latest
    container_name: nexus-ollama-model
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["if [ \"$${OLLAMA_BASE_URL}\" != \"http://ollama:11434\" ]; then echo 'Using configured external Ollama; skip local model pull.'; exit 0; fi; until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull $${OLLAMA_MODEL:-qwen3:4b} && ollama pull $${EMBEDDING_MODEL:-embeddinggemma}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
    networks: [nexus-network]
    restart: "no"

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-before-deployment}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3456,http://127.0.0.1:3456}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3456}
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD:-nexus-local-dev}@db:5432/nexus
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-45}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-1024}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-256}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-15}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      VISUAL_EXPERT_ENABLED: ${VISUAL_EXPERT_ENABLED:-True}
      EXPERT_GIT_BASE_URL: ${EXPERT_GIT_BASE_URL:-}
      EXPERT_GIT_REPOSITORY: ${EXPERT_GIT_REPOSITORY:-}
      EXPERT_GIT_ACCESS_TOKEN: ${EXPERT_GIT_ACCESS_TOKEN:-}
    ports:
      - "8999:8999"
    volumes:
      - backend_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks: [nexus-network]

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    restart: unless-stopped
    ports:
      - "3456:80"
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks: [nexus-network]

volumes:
  postgres_data:
  ollama_data:
  backend_logs:
  nginx_logs:

networks:
  nexus-network:
    driver: bridge
