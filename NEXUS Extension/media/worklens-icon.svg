<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wlBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="wlPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="wlAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="wlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#wlBgGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="4"/>

  <!-- Subtle ambient inner ring -->
  <rect x="38" y="38" width="436" height="436" rx="96" fill="none" stroke="#60a5fa" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Outer Precision Lens Frame with smooth rounded corners -->
  <rect x="80" y="80" width="352" height="352" rx="90" fill="none" stroke="url(#wlPrimaryGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#wlGlow)"/>

  <!-- Optical Aperture Focus Ring -->
  <circle cx="256" cy="256" r="116" fill="none" stroke="#60a5fa" stroke-width="14" stroke-dasharray="20 24" stroke-opacity="0.5"/>

  <!-- Code Chevron: Left < -->
  <path d="M210 196L150 256L210 316" fill="none" stroke="url(#wlPrimaryGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Code Chevron: Right > -->
  <path d="M302 196L362 256L302 316" fill="none" stroke="url(#wlPrimaryGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Focus Nexus Node -->
  <circle cx="256" cy="256" r="24" fill="#38bdf8" filter="url(#wlGlow)"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>

  <!-- Lens Crosshair Ticks -->
  <line x1="256" y1="80" x2="256" y2="124" stroke="url(#wlAccentGrad)" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="388" x2="256" y2="432" stroke="url(#wlAccentGrad)" stroke-width="18" stroke-linecap="round"/>
  <line x1="80" y1="256" x2="124" y2="256" stroke="url(#wlAccentGrad)" stroke-width="18" stroke-linecap="round"/>
  <line x1="388" y1="256" x2="432" y2="256" stroke="url(#wlAccentGrad)" stroke-width="18" stroke-linecap="round"/>
</svg>
